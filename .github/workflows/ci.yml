name: AI Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.json

      - name: Verify SBOM
        run: test -s sbom.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify production artifacts
        shell: bash
        run: |
          test -f dist/main.js
          test -f dist/infrastructure/postgres/migrate.js
          test -f dist/infrastructure/postgres/migrations/001_ai_core.sql
          test -f dist/infrastructure/postgres/migrations/002_production_hardening.sql
          test -f dist/infrastructure/postgres/migrations/003_enterprise_hardening.sql
          test -f dist/infrastructure/postgres/migrations/004_daily_quota_hardening.sql
          test -f dist/infrastructure/postgres/migrations/005_mission_runtime.sql
          test -f dist/infrastructure/postgres/migrations/006_mission_tasks.sql
          test -f dist/infrastructure/postgres/migrations/007_task_leases.sql
